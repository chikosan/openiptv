version: "2"
language: "en"
tone_instructions: "Be concise and practical. Focus on bugs, security, and correctness. Skip style nitpicks."
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  path_filters:
    - "!android/**"
    - "!dist/**"
    - "!.next/**"
    - "!node_modules/**"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
chat:
  auto_reply: true
